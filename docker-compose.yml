services:
  app:
    image: denishelloworld/home_library_app:v1
    container_name: home_library_app
    restart: always
    ports:
      - '${PORT:-4000}:4000'
    volumes:
      - logs_data:/app/logs
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - my_network

  db:
    image: postgres:13
    container_name: home_library_db
    restart: always
    env_file:
      - .env

    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - my_network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"

networks:
  my_network:
    driver: bridge

volumes:
  db_data:
  logs_data:
